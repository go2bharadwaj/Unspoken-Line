# Render Blueprint: hosts the app off Google Cloud while project unspoken-line is suspended.
# Guest mode only: no Firebase vars, so no sign-in, Firestore history or encrypted vault.
# If Render renames a service (name taken), update VITE_API_URL and ALLOWED_ORIGINS to match.
services:
  - type: web
    name: unspoken-lines-api
    runtime: docker
    plan: free # shortcut: sleeps after 15 min idle (~1 min cold start); open the app before judging or upgrade to starter
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false # entered in the Render dashboard, never committed
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: ALLOWED_ORIGINS
        value: https://unspoken-lines.onrender.com

  - type: web
    name: unspoken-lines
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://unspoken-lines-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
